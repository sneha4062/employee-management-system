<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamPulse - Enterprise HR Management</title>
  <script>
    try {
      const session = localStorage.getItem('teampulse_session');
      if (session) {
        const user = JSON.parse(session);
        if (user && user.role === 'admin') {
          window.location.replace('frontend/pages/admin/dashboard.html');
        } else if (user) {
          window.location.replace('frontend/pages/employee/profile.html');
        } else {
          window.location.replace('frontend/pages/auth/login.html');
        }
      } else {
        window.location.replace('frontend/pages/auth/login.html');
      }
    } catch (e) {
      window.location.replace('frontend/pages/auth/login.html');
    }
  </script>
</head>
<body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
  <p>Redirecting to <a href="frontend/pages/auth/login.html" style="color: #3b82f6; font-weight: 600;">Sign In</a>...</p>
</body>
</html>
