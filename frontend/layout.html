<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamPulse - Enterprise Portal</title>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>TeamPulse</span>
      </div>

      <!-- Admin links -->
      <nav class="sidebar-menu" id="admin-nav" style="display: none;">
        <div class="menu-label">ADMINISTRATION</div>
        <a href="dashboard.html" class="nav-item active">
          <i class="fa-solid fa-users"></i>
          <span>Workforce</span>
        </a>
        <a href="departments.html" class="nav-item">
          <i class="fa-solid fa-building"></i>
          <span>Departments</span>
        </a>
        <a href="attendance.html" class="nav-item">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Attendance</span>
        </a>
        <a href="settings.html" class="nav-item">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Employee links -->
      <nav class="sidebar-menu" id="employee-nav" style="display: none;">
        <div class="menu-label">EMPLOYEE PORTAL</div>
        <a href="profile.html" class="nav-item active">
          <i class="fa-solid fa-id-card"></i>
          <span>My Profile</span>
        </a>
        <a href="attendance.html" class="nav-item">
          <i class="fa-solid fa-clock"></i>
          <span>My Attendance</span>
        </a>
        <a href="team.html" class="nav-item">
          <i class="fa-solid fa-user-group"></i>
          <span>My Team</span>
        </a>
        <a href="settings.html" class="nav-item">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- User info & logout -->
      <div class="sidebar-footer">
        <div class="user-badge">
          <i class="fa-solid fa-circle-user avatar-icon"></i>
          <div class="user-details">
            <span class="user-name" id="user-display-name">User Name</span>
            <span class="user-role-tag" id="user-display-role">Role</span>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-wrapper">
      
      <!-- Top bar -->
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title" id="page-title">Page Title</h1>
          <p class="page-subtitle" id="page-subtitle">Page description and summary</p>
        </div>
        <div class="header-right">
          <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="content-container">
        <!-- Page content placeholder -->
        <p>This is the standard layout structure for TeamPulse pages.</p>
      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
