<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Employee | TeamPulse</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>TeamPulse</span>
      </div>

      <nav class="sidebar-menu" id="employee-nav">
        <div class="menu-label">EMPLOYEE PORTAL</div>
        <a href="profile.html" class="nav-item">
          <i class="fa-solid fa-id-card"></i>
          <span>My Profile</span>
        </a>
        <a href="attendance.html" class="nav-item">
          <i class="fa-solid fa-clock"></i>
          <span>My Attendance</span>
        </a>
        <a href="team.html" class="nav-item">
          <i class="fa-solid fa-user-group"></i>
          <span>My Team</span>
        </a>
        <a href="settings.html" class="nav-item active">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <i class="fa-solid fa-circle-user avatar-icon"></i>
          <div class="user-details">
            <span class="user-name" id="user-display-name">Employee</span>
            <span class="user-role-tag" id="user-display-role">Employee</span>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title">Personal Settings</h1>
          <p class="page-subtitle">Customize your individual theme and workspace preferences</p>
        </div>
        <div class="header-right">
          <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="content-container">

        <div class="card" style="max-width: 550px;">
          <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 16px;">Display Theme</h2>
          <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px;">
            Switch between light and dark modes according to your preference.
          </p>

          <button class="btn btn-secondary" onclick="document.getElementById('theme-toggle').click()">
            <i class="fa-solid fa-circle-half-stroke"></i>
            <span>Switch Theme (Dark / Light)</span>
          </button>
        </div>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/employee.js"></script>
  <script>
    Employee.initSettings();
  </script>
</body>
</html>
