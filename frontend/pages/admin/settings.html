<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin | TeamPulse</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>TeamPulse</span>
      </div>

      <nav class="sidebar-menu" id="admin-nav">
        <div class="menu-label">ADMINISTRATION</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-users"></i>
          <span>Workforce</span>
        </a>
        <a href="departments.html" class="nav-item">
          <i class="fa-solid fa-building"></i>
          <span>Departments</span>
        </a>
        <a href="attendance.html" class="nav-item">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Attendance</span>
        </a>
        <a href="settings.html" class="nav-item active">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <i class="fa-solid fa-circle-user avatar-icon"></i>
          <div class="user-details">
            <span class="user-name" id="user-display-name">Admin</span>
            <span class="user-role-tag" id="user-display-role">Administrator</span>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title">Company Settings</h1>
          <p class="page-subtitle">Configure organization preferences and portal defaults</p>
        </div>
        <div class="header-right">
          <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="content-container">

        <div class="card" style="max-width: 600px;">
          <h2 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;">General Preferences</h2>
          
          <form id="settings-form">
            <div class="form-group">
              <label class="form-label">Organization / Company Name</label>
              <input type="text" id="setting-company-name" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label">Standard Working Hours</label>
              <input type="text" id="setting-hours" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label">Default Timezone</label>
              <input type="text" id="setting-timezone" class="form-control" required>
            </div>

            <div style="margin-top: 24px;">
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save Changes</span>
              </button>
            </div>
          </form>
        </div>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    Admin.initSettings();
  </script>
</body>
</html>
