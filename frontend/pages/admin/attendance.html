<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Admin | TeamPulse</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>TeamPulse</span>
      </div>

      <nav class="sidebar-menu" id="admin-nav">
        <div class="menu-label">ADMINISTRATION</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-users"></i>
          <span>Workforce</span>
        </a>
        <a href="departments.html" class="nav-item">
          <i class="fa-solid fa-building"></i>
          <span>Departments</span>
        </a>
        <a href="attendance.html" class="nav-item active">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Attendance</span>
        </a>
        <a href="settings.html" class="nav-item">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <i class="fa-solid fa-circle-user avatar-icon"></i>
          <div class="user-details">
            <span class="user-name" id="user-display-name">Admin</span>
            <span class="user-role-tag" id="user-display-role">Administrator</span>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title">Daily Attendance Tracker</h1>
          <p class="page-subtitle">Track and mark attendance status for the entire organization</p>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary" id="btn-mark-all-present">
            <i class="fa-solid fa-check-double"></i>
            <span>Mark All Present</span>
          </button>
          <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="content-container">

        <!-- Date filter -->
        <div class="controls-bar">
          <div style="display: flex; align-items: center; gap: 12px;">
            <label style="font-weight: 600; font-size: 0.9rem;">Select Date:</label>
            <input type="date" id="attendance-date" class="form-control" style="width: auto;">
          </div>
        </div>

        <!-- Summary counters -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--success-bg); color: var(--success);">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="stat-info">
              <h3>Present</h3>
              <div class="stat-value" id="count-present">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--warning-bg); color: var(--warning);">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div class="stat-info">
              <h3>Late</h3>
              <div class="stat-value" id="count-late">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background-color: #e0e7ff; color: #4338ca;">
              <i class="fa-solid fa-calendar-minus"></i>
            </div>
            <div class="stat-info">
              <h3>On Leave</h3>
              <div class="stat-value" id="count-leave">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--danger-bg); color: var(--danger);">
              <i class="fa-solid fa-circle-xmark"></i>
            </div>
            <div class="stat-info">
              <h3>Absent</h3>
              <div class="stat-value" id="count-absent">0</div>
            </div>
          </div>
        </div>

        <!-- Attendance table -->
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Mark Status</th>
              </tr>
            </thead>
            <tbody id="attendance-table-body">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    Admin.initAttendance();
  </script>
</body>
</html>
